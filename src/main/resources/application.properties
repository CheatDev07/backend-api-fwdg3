spring.application.name=ecommerce-api-sb13
spring.profiles.active=dev

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.threads.virtual.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
media.location=/Users/Admin/OneDrive/Pictures/full stack/ecommer_image/
media.client-path=/media
media.base-uri=http://localhost:1333

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:1301}
keycloak.realm=ecommerce
keycloak.client-id=private-app
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${keycloak.server-url}/realms/${keycloak.realm}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}